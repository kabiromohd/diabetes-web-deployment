[project]
name = "dsn-docker-class"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kabir Mohammed", email = "kabirwale@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "joblib>=1.5.3",
    "jupyter>=1.1.1",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "streamlit>=1.62.0",
]

[project.scripts]
dsn-docker-class = "dsn_docker_class:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
